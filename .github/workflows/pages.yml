
name: Pubblica Peugeot Connect

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: peugeot-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Genera configurazione pubblica
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          GOOGLE_MAPS_API_KEY: ${{ vars.GOOGLE_MAPS_API_KEY }}

        run: |
          set -euo pipefail

          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_PUBLISHABLE_KEY"
          test -n "$GOOGLE_MAPS_API_KEY"

          python3 - <<'PY'
          import json
          import os
          import pathlib

          config = {
              "supabaseUrl": os.environ["SUPABASE_URL"],
              "supabasePublishableKey": os.environ["SUPABASE_PUBLISHABLE_KEY"],
              "googleMapsApiKey": os.environ["GOOGLE_MAPS_API_KEY"]
          }

          output = pathlib.Path("site/config.js")
          output.parent.mkdir(parents=True, exist_ok=True)

          output.write_text(
              "window.PEUGEOT_CONFIG = " +
              json.dumps(config) +
              ";\n",
              encoding="utf-8"
          )

          print("Configurazione Peugeot Connect generata.")
          print("Supabase URL: presente")
          print("Supabase Publishable Key: presente")
          print("Google Maps API Key: presente")
          PY

      - name: Configura GitHub Pages
        uses: actions/configure-pages@v5

      - name: Verifica contenuto del sito
        run: |
          set -euo pipefail
          test -s site/index.html
          test -s site/config.js
          test -s site/v2/index.html
          test -s site/v2/app.js
          node --check site/v2/app.js
          test -s site/v2/percorsi/index.html
          node --check site/v2/percorsi/app.js

      - name: Crea archivio Pages
        run: |
          set -euo pipefail
          tar --dereference --hard-dereference --exclude=.git --exclude=.github -C site -cf "$RUNNER_TEMP/artifact.tar" .
          test -s "$RUNNER_TEMP/artifact.tar"
          tar -tf "$RUNNER_TEMP/artifact.tar" | grep -Fx './v2/percorsi/index.html'

      - name: Carica archivio Pages
        uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          if-no-files-found: error
          retention-days: 2
          overwrite: true
          compression-level: 0

      - name: Attendi visibilità archivio tramite API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=github-pages" --jq '[.artifacts[] | select(.name == "github-pages" and .expired == false)] | length') || count=0
            if [ "$count" = 1 ]; then
              echo "Archivio github-pages disponibile"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Archivio github-pages non visibile tramite API"
          exit 1

      - name: Pubblica Peugeot Connect
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
